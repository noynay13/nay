<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Chiranupong K — Drak Nay</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c9a75c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ตารางเรียน">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:       #07080f;
  --s0:       #0c0d17;
  --s1:       #10121c;
  --s2:       #161826;
  --s3:       #1c1f30;
  --border:   #1e2236;
  --border2:  #272c42;
  --muted:    #363d58;
  --dim:      #525c7a;
  --mid:      #838dac;
  --base:     #c2c8de;
  --hi:       #eceef8;

  --gold:     #c9a75c;
  --gold-lo:  rgba(201,167,92,.10);
  --gold-glow:rgba(201,167,92,.22);
  --gold-hi:  #dfc07a;

  --c-mon:#5b9bd6;  --m-mon:rgba(91,155,214,.12);
  --c-tue:#c9607a;  --m-tue:rgba(201,96,122,.12);
  --c-wed:#5bba8f;  --m-wed:rgba(91,186,143,.12);
  --c-thu:#c9a040;  --m-thu:rgba(201,160,64,.12);
  --c-fri:#9268cc;  --m-fri:rgba(146,104,204,.12);
  --c-cyan:#4db8b8; --m-cyan:rgba(77,184,184,.12);
  --c-rose:#c45f8f; --m-rose:rgba(196,95,143,.12);
  --c-lime:#82c44a; --m-lime:rgba(130,196,74,.12);

  --r:10px;--r-lg:14px;--r-xl:18px;
  --font:'Sarabun',sans-serif;
  --mono:'IBM Plex Mono',monospace;
  --sh-sm:0 2px 10px rgba(0,0,0,.5);
  --sh-md:0 4px 28px rgba(0,0,0,.6),0 1px 4px rgba(0,0,0,.4);
  --sh-lg:0 8px 48px rgba(0,0,0,.75),0 2px 10px rgba(0,0,0,.5);
}

html{scroll-behavior:smooth}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--base);
  min-height:100vh;
  overflow-x:hidden;
}

/* ── SHELL ── */
.shell{
  max-width:980px;margin:0 auto;
  padding:0 0 6rem;
}
@media(min-width:700px){.shell{padding-bottom:2.5rem}}

/* ── HEADER ── */
.hdr{
  background:var(--s1);
  border-bottom:1px solid var(--border);
  padding:1.4rem 1.4rem 1.2rem;
  position:relative;overflow:hidden;
}
.hdr::before{
  content:'';position:absolute;
  top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent 0%,var(--gold) 40%,var(--gold-hi) 55%,var(--gold) 70%,transparent 100%);
}
.hdr-inner{
  display:flex;align-items:flex-start;
  justify-content:space-between;gap:1rem;
}
.hdr-brand{
  display:flex;align-items:center;gap:.7rem;margin-bottom:.5rem;
}
.hdr-icon{
  width:32px;height:32px;border-radius:8px;
  background:linear-gradient(135deg,var(--gold) 0%,rgba(201,167,92,.3) 100%);
  border:1px solid var(--gold);
  display:flex;align-items:center;justify-content:center;
  font-size:.8rem;flex-shrink:0;
  box-shadow:0 0 16px var(--gold-glow);
}
.hdr-eyebrow{
  font-family:var(--mono);font-size:.6rem;
  letter-spacing:.15em;text-transform:uppercase;
  color:var(--gold);
}
.edit-title{
  display:block;width:100%;
  font-size:1.4rem;font-weight:700;color:var(--hi);
  background:none;border:none;outline:none;
  font-family:var(--font);
  border-bottom:1px solid transparent;
  transition:border-color .2s;padding:2px 0;
}
.edit-title:focus{border-bottom-color:var(--gold)}
.edit-sem{
  font-size:.8rem;color:var(--mid);
  background:none;border:none;outline:none;
  font-family:var(--font);padding:1px 0;
  border-bottom:1px solid transparent;
  transition:border-color .2s;
}
.edit-sem:focus{border-bottom-color:var(--dim);color:var(--base)}
.hdr-meta{display:flex;align-items:center;gap:.5rem;margin-top:.4rem}
.sem-dot{color:var(--dim);font-size:.7rem}
.hdr-pills{
  display:flex;flex-direction:column;
  align-items:flex-end;gap:.45rem;
  flex-shrink:0;
}
.pill{
  background:var(--s2);border:1px solid var(--border2);
  border-radius:20px;padding:.28rem .85rem;
  font-size:.68rem;font-family:var(--mono);
  color:var(--mid);white-space:nowrap;
}
.pill strong{color:var(--gold);margin-left:.3rem}

/* ── EDIT MODE TOGGLE ── */
.edit-mode-btn{
  display:flex;align-items:center;gap:.45rem;
  padding:.32rem .85rem;border-radius:20px;
  border:1px solid var(--border2);
  background:var(--s2);
  font-size:.68rem;font-family:var(--mono);
  color:var(--dim);cursor:pointer;
  transition:all .2s;white-space:nowrap;
  letter-spacing:.04em;
}
.edit-mode-btn:hover{border-color:var(--gold);color:var(--gold)}
.edit-mode-btn.active{
  background:rgba(201,167,92,.12);
  border-color:var(--gold);color:var(--gold);
}
.edit-mode-btn .btn-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--muted);transition:background .2s;
  flex-shrink:0;
}
.edit-mode-btn.active .btn-dot{background:var(--gold)}

/* ── QR CARD LINK BTN ── */
.qr-link-btn{
  display:flex;align-items:center;gap:.4rem;
  padding:.32rem .85rem;border-radius:20px;
  border:1px solid var(--border2);
  background:var(--s2);
  font-size:.68rem;font-family:var(--mono);
  color:var(--mid);cursor:pointer;
  transition:all .2s;white-space:nowrap;
  letter-spacing:.04em;
  text-decoration:none;
}
.qr-link-btn:hover{
  border-color:var(--gold);color:var(--gold);
  background:var(--gold-lo);
}

/* ── READ-ONLY: hide edit controls ── */
body:not(.edit-mode) .day-add-btn,
body:not(.edit-mode) .ds-add,
body:not(.edit-mode) .scard-empty,
body:not(.edit-mode) .cal-add-task-row,
body:not(.edit-mode) .ds-add-btn,
body:not(.edit-mode) #fab-btn{
  display:none !important;
}
body:not(.edit-mode) .lane-cell{cursor:default;}
body:not(.edit-mode) .lane-cell:hover{background:none;}
body:not(.edit-mode) .cblock{cursor:default;}
body:not(.edit-mode) .cblock:hover{filter:none;box-shadow:none;transform:none;}
body:not(.edit-mode) .scard{cursor:default;}
body:not(.edit-mode) .scard:hover{transform:none;box-shadow:var(--sh-sm);border-color:var(--border);}
body:not(.edit-mode) .edit-title,
body:not(.edit-mode) .edit-sem{pointer-events:none;}
body:not(.edit-mode) .ds-course-row{cursor:default;}
body:not(.edit-mode) .ds-course-row:hover{border-color:var(--border);}
body:not(.edit-mode) .cal-cell{cursor:default;}
body:not(.edit-mode) .cal-cell:hover:not(.other){background:transparent;}
body:not(.edit-mode) .cal-cell.today:hover{background:var(--gold-lo);}

/* view-only indicator strip */
.view-only-bar{
  display:none;
  align-items:center;justify-content:center;gap:.5rem;
  padding:.38rem 1.4rem;
  background:var(--s0);
  border-bottom:1px solid var(--border);
  font-size:.65rem;font-family:var(--mono);
  color:var(--muted);letter-spacing:.06em;
}
body:not(.edit-mode) .view-only-bar{display:flex;}

/* ── TABS (desktop top / mobile bottom) ── */
.tabs-wrap{
  padding:.85rem 1.4rem .6rem;
  display:flex;gap:4px;
  background:var(--s1);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:50;
}
@media(max-width:699px){
  .tabs-wrap{
    position:fixed;bottom:0;top:auto;
    left:0;right:0;
    padding:.6rem .8rem calc(.6rem + env(safe-area-inset-bottom));
    justify-content:space-around;
    background:rgba(10,11,20,.9);
    backdrop-filter:blur(20px);
    border-top:1px solid var(--border);
    border-bottom:none;
    box-shadow:0 -8px 24px rgba(0,0,0,.6);
  }
}
.tab{
  padding:.45rem 1.15rem;border-radius:8px;border:none;
  background:none;color:var(--dim);
  font:500 .78rem var(--font);
  letter-spacing:.03em;cursor:pointer;
  transition:all .18s;display:flex;
  align-items:center;gap:.4rem;
}
.tab-icon{font-size:.95rem}
.tab.active{background:var(--s2);color:var(--hi);box-shadow:var(--sh-sm),0 0 0 1px var(--border2)}
.tab:not(.active):hover{color:var(--mid)}
@media(max-width:699px){
  .tab{flex-direction:column;gap:.2rem;padding:.4rem .8rem;font-size:.65rem;flex:1;justify-content:center}
  .tab-icon{font-size:1.1rem}
}

/* ── VIEW CONTAINERS ── */
.view{display:none}
.view.active{display:block}
.view-pad{padding:1.4rem}
@media(max-width:699px){.view-pad{padding:1rem}}

/* ═══════════════════════════════════════════
   GRID VIEW
═══════════════════════════════════════════ */
.tt-wrap{overflow-x:auto;padding:1.4rem 1.4rem 0;-webkit-overflow-scrolling:touch}
.tt{
  min-width:700px;
  background:var(--s1);
  border:1px solid var(--border);
  border-radius:var(--r-lg);
  box-shadow:var(--sh-md);
  overflow:hidden;
}
.tt-head{
  display:grid;
  grid-template-columns:90px repeat(11,1fr);
  background:var(--s2);
  border-bottom:1px solid var(--border);
}
.th-cell{
  padding:.55rem .25rem;
  font-size:.62rem;font-family:var(--mono);
  color:var(--dim);text-align:center;
  letter-spacing:.05em;
  border-right:1px solid var(--border);
}
.th-cell:last-child{border-right:none}
.th-cell.first{text-align:left;padding-left:.9rem;color:var(--muted)}

.tt-row{
  display:grid;
  grid-template-columns:90px 1fr;
  border-bottom:1px solid var(--border);
  min-height:68px;
}
.tt-row:last-child{border-bottom:none}
.tt-day-label{
  padding:.5rem .8rem;
  display:flex;flex-direction:column;
  gap:.25rem;justify-content:center;
  border-right:1px solid var(--border);
  background:var(--s2);
  position:relative;
}
.day-label-txt{
  font-size:.8rem;font-weight:600;color:var(--base);
  white-space:nowrap;
}
.day-add-btn{
  font-size:.62rem;color:var(--dim);
  cursor:pointer;background:none;border:none;
  font-family:var(--font);text-align:left;
  padding:0;transition:color .15s;
}
.day-add-btn:hover{color:var(--gold)}

.tt-lane{
  position:relative;
  display:grid;
  grid-template-columns:repeat(11,1fr);
}
.lane-cell{
  border-right:1px solid var(--border);
  min-height:68px;
  transition:background .12s;cursor:pointer;
}
.lane-cell:last-child{border-right:none}
.lane-cell:hover{background:rgba(255,255,255,.018)}

.cblock{
  position:absolute;top:5px;bottom:5px;
  border-radius:8px;padding:.4rem .55rem;
  cursor:pointer;overflow:hidden;border:1px solid;
  transition:filter .15s,box-shadow .15s,transform .12s;z-index:2;
}
.cblock:hover{filter:brightness(1.18);box-shadow:0 4px 20px rgba(0,0,0,.5);transform:translateY(-1px)}
.cb-code{font-family:var(--mono);font-size:.6rem;font-weight:500;opacity:.75}
.cb-name{font-size:.72rem;font-weight:600;color:var(--hi);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb-room{font-size:.6rem;margin-top:3px;opacity:.55}

/* ═══════════════════════════════════════════
   CARDS VIEW  (streaming-app style)
═══════════════════════════════════════════ */
#view-cards{padding-top:.4rem}
.day-section{margin-bottom:1.6rem}
.day-section-hdr{
  display:flex;align-items:center;
  gap:.75rem;padding:.5rem 1.4rem .6rem;
}
.day-section-hdr .ds-name{
  font-size:.72rem;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;
  white-space:nowrap;
}
.day-section-hdr .ds-line{flex:1;height:1px;background:var(--border)}
.ds-add{
  font-size:.66rem;color:var(--dim);cursor:pointer;
  background:none;border:1px dashed var(--border2);
  border-radius:6px;padding:.22rem .7rem;
  transition:all .15s;font-family:var(--font);
  white-space:nowrap;
}
.ds-add:hover{border-color:var(--gold);color:var(--gold)}

.cards-scroll{
  display:flex;gap:.9rem;
  overflow-x:auto;
  padding:0 1.4rem .8rem;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.cards-scroll::-webkit-scrollbar{display:none}

/* Course card – streaming style */
.scard{
  flex-shrink:0;
  width:160px;
  background:var(--s1);
  border:1px solid var(--border);
  border-radius:var(--r-lg);
  overflow:hidden;
  cursor:pointer;
  transition:transform .18s,box-shadow .18s,border-color .18s;
  box-shadow:var(--sh-sm);
}
@media(min-width:700px){.scard{width:190px}}
.scard:hover{transform:translateY(-3px);box-shadow:var(--sh-md);border-color:var(--border2)}
.scard:active{transform:translateY(0)}

.scard-cover{
  height:88px;
  position:relative;
  overflow:hidden;
  display:flex;align-items:flex-end;
  padding:.55rem .65rem;
}
@media(min-width:700px){.scard-cover{height:100px}}
.scard-code{
  font-family:var(--mono);font-size:.72rem;font-weight:600;
  color:rgba(255,255,255,.92);
  text-shadow:0 1px 4px rgba(0,0,0,.6);
  z-index:2;position:relative;
  line-height:1.2;
}
.scard-credits-badge{
  position:absolute;top:.5rem;right:.55rem;
  background:rgba(0,0,0,.45);backdrop-filter:blur(4px);
  border-radius:5px;padding:.14rem .45rem;
  font-family:var(--mono);font-size:.58rem;
  color:rgba(255,255,255,.7);
  z-index:2;
}

.scard-body{padding:.65rem .7rem .75rem}
.scard-name{
  font-size:.82rem;font-weight:600;
  color:var(--hi);line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;
  min-height:2.1em;
}
.scard-time{
  display:flex;align-items:center;gap:.35rem;
  margin-top:.5rem;
}
.scard-time-chip{
  font-family:var(--mono);font-size:.62rem;
  background:var(--s3);border-radius:4px;
  padding:.18rem .4rem;color:var(--mid);
}
.scard-room{
  font-size:.68rem;color:var(--muted);
  margin-top:.4rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* empty day card */
.scard-empty{
  flex-shrink:0;width:140px;
  border:1px dashed var(--border);
  border-radius:var(--r-lg);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:.4rem;height:140px;
  color:var(--muted);font-size:.75rem;
  cursor:pointer;transition:all .15s;
}
.scard-empty:hover{border-color:var(--gold);color:var(--gold)}
.scard-empty-icon{font-size:1.4rem;opacity:.5}

/* ═══════════════════════════════════════════
   CALENDAR VIEW
═══════════════════════════════════════════ */
.cal-outer{padding:1.4rem}
@media(max-width:699px){.cal-outer{padding:1rem}}
.cal-wrap{
  background:var(--s1);
  border:1px solid var(--border);
  border-radius:var(--r-xl);
  box-shadow:var(--sh-md);
  overflow:hidden;
}
.cal-top{
  display:flex;align-items:center;justify-content:space-between;
  padding:1.1rem 1.4rem;
  border-bottom:1px solid var(--border);
  background:var(--s2);
}
.cal-month-title{font-size:1rem;font-weight:700;color:var(--hi)}
.cal-nav-grp{display:flex;align-items:center;gap:.4rem}
.cal-navbtn{
  width:30px;height:30px;border-radius:7px;
  border:1px solid var(--border2);background:var(--s1);
  color:var(--mid);font-size:.9rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.cal-navbtn:hover{border-color:var(--gold);color:var(--gold)}
.cal-today-btn{
  font-size:.66rem;font-family:var(--mono);
  padding:.22rem .65rem;border-radius:6px;
  border:1px solid var(--border2);background:var(--s1);
  color:var(--dim);cursor:pointer;transition:all .15s;
  letter-spacing:.04em;
}
.cal-today-btn:hover{border-color:var(--gold);color:var(--gold)}

.cal-grid-hdr{
  display:grid;grid-template-columns:repeat(7,1fr);
  border-bottom:1px solid var(--border);
  background:var(--s2);
}
.cal-dh{
  padding:.5rem .3rem;text-align:center;
  font-size:.62rem;letter-spacing:.07em;
  text-transform:uppercase;font-family:var(--mono);
  color:var(--dim);
}
.cal-body{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-cell{
  min-height:78px;padding:.5rem .45rem .4rem;
  border-right:1px solid var(--border);
  border-bottom:1px solid var(--border);
  position:relative;cursor:pointer;
  transition:background .12s;
}
@media(max-width:699px){.cal-cell{min-height:58px;padding:.4rem .3rem .3rem}}
.cal-cell:nth-child(7n){border-right:none}
.cal-cell:nth-last-child(-n+7):not(:nth-child(7n+1)){border-bottom:none}
.cal-cell:nth-last-child(-n+7){border-bottom:none}
.cal-cell:hover:not(.other){background:var(--s2)}
.cal-cell.other{opacity:.25;pointer-events:none}
.cal-cell.today{background:var(--gold-lo)}
.cal-num{
  font-family:var(--mono);font-size:.7rem;
  color:var(--dim);display:block;
  line-height:1;margin-bottom:.35rem;
}
.cal-cell.today .cal-num{
  background:var(--gold);color:#07080f;
  border-radius:50%;width:20px;height:20px;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.66rem;
}
.cal-dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:.2rem}
.cal-dot{
  width:6px;height:6px;border-radius:50%;
  flex-shrink:0;
}
@media(max-width:699px){.cal-dot{width:5px;height:5px}}
.cal-task-badge{
  position:absolute;bottom:.35rem;right:.4rem;
  background:var(--gold);color:#07080f;
  border-radius:4px;font-family:var(--mono);
  font-size:.56rem;font-weight:700;
  padding:.1rem .3rem;min-width:14px;text-align:center;
  line-height:1.4;
}

/* ── ADD TASK STRIP ── */
.cal-add-task-row{
  padding:.75rem 1.4rem;
  border-top:1px solid var(--border);
  background:var(--s2);
}
.cal-add-task-btn{
  width:100%;padding:.6rem;border-radius:9px;
  border:1px dashed var(--border2);background:none;
  color:var(--dim);font-family:var(--font);
  font-size:.8rem;cursor:pointer;transition:all .15s;
  display:flex;align-items:center;justify-content:center;gap:.5rem;
}
.cal-add-task-btn:hover{border-color:var(--gold);color:var(--gold)}

/* ═══════════════════════════════════════════
   MODAL / OVERLAY
═══════════════════════════════════════════ */
.overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.8);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;
  padding:1rem;opacity:0;pointer-events:none;
  transition:opacity .22s;
}
.overlay.open{opacity:1;pointer-events:all}
.modal{
  background:var(--s1);border:1px solid var(--border2);
  border-radius:var(--r-xl);
  width:100%;max-width:420px;
  box-shadow:var(--sh-lg),0 0 0 1px var(--gold) inset;
  position:relative;
  transform:translateY(14px) scale(.98);
  transition:transform .22s;
  max-height:90vh;overflow-y:auto;
}
.overlay.open .modal{transform:translateY(0) scale(1)}
@media(max-width:699px){
  .overlay{align-items:flex-end;padding:0}
  .modal{max-width:100%;border-radius:var(--r-xl) var(--r-xl) 0 0;max-height:85vh}
  .overlay.open .modal{transform:translateY(0)}
}
.modal-head{
  padding:1.1rem 1.3rem .9rem;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;background:var(--s1);z-index:2;
}
.modal-head::after{
  content:'';position:absolute;
  top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
.modal-title{font-size:.92rem;font-weight:700;color:var(--hi)}
.modal-close{
  width:28px;height:28px;border-radius:7px;
  border:1px solid var(--border);background:var(--s2);
  color:var(--mid);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:.85rem;transition:all .15s;
}
.modal-close:hover{border-color:var(--dim);color:var(--hi)}

.modal-body{padding:1.1rem 1.3rem}
.form-row{margin-bottom:.85rem}
.form-row-2{
  display:grid;grid-template-columns:1fr 1fr;
  gap:.65rem;margin-bottom:.85rem;
}
.form-label{
  display:block;font-size:.64rem;
  letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);font-family:var(--mono);
  margin-bottom:.3rem;
}
.form-input{
  width:100%;background:var(--s2);
  border:1px solid var(--border2);
  border-radius:8px;padding:.52rem .75rem;
  font:inherit;font-size:.82rem;color:var(--hi);
  outline:none;
  transition:border-color .18s,box-shadow .18s;
}
.form-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-lo)}
.form-input option{background:var(--s2)}
textarea.form-input{resize:vertical;min-height:72px;line-height:1.5}

.color-row{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.3rem}
.color-swatch{
  width:26px;height:26px;border-radius:7px;
  cursor:pointer;border:2px solid transparent;
  transition:all .15s;
}
.color-swatch.active{border-color:var(--hi);box-shadow:0 0 0 1px rgba(255,255,255,.25)}

.modal-foot{
  padding:.85rem 1.3rem 1rem;
  border-top:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;gap:.5rem;
  position:sticky;bottom:0;background:var(--s1);z-index:2;
}
.btn{
  padding:.52rem 1.2rem;border-radius:8px;
  font:600 .8rem var(--font);cursor:pointer;
  transition:all .18s;border:1px solid;
  letter-spacing:.02em;
}
.btn-primary{
  background:var(--gold);border-color:var(--gold);
  color:#07080f;box-shadow:0 2px 14px var(--gold-glow);
}
.btn-primary:hover{filter:brightness(1.1)}
.btn-ghost{background:transparent;border-color:var(--border2);color:var(--mid)}
.btn-ghost:hover{border-color:var(--dim);color:var(--base)}
.btn-danger{background:transparent;border-color:rgba(200,70,70,.35);color:#d47f7f}
.btn-danger:hover{background:rgba(200,70,70,.08)}
.btn-group-r{display:flex;gap:.5rem;margin-left:auto}

/* ── DAY SHEET (click calendar cell) ── */
#day-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.78);backdrop-filter:blur(8px);
  display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;transition:opacity .22s;
}
@media(min-width:700px){
  #day-overlay{align-items:center;justify-content:center;padding:1rem}
}
#day-overlay.open{opacity:1;pointer-events:all}
.day-sheet{
  background:var(--s1);border:1px solid var(--border2);
  border-radius:var(--r-xl) var(--r-xl) 0 0;
  width:100%;max-height:80vh;overflow-y:auto;
  transform:translateY(30px);transition:transform .25s;
}
@media(min-width:700px){
  .day-sheet{
    border-radius:var(--r-xl);
    max-width:460px;max-height:85vh;
  }
}
#day-overlay.open .day-sheet{transform:translateY(0)}
.day-sheet-head{
  padding:1.1rem 1.4rem .9rem;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;background:var(--s1);z-index:2;
}
.day-sheet-head::after{
  content:'';position:absolute;
  top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
.day-sheet-title{font-size:.95rem;font-weight:700;color:var(--hi)}
.day-sheet-body{padding:1rem 1.4rem 1.2rem}
.ds-section-label{
  font-size:.62rem;font-family:var(--mono);
  letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);margin-bottom:.6rem;
  display:flex;align-items:center;gap:.6rem;
}
.ds-section-label::after{content:'';flex:1;height:1px;background:var(--border)}

/* mini course row in day sheet */
.ds-course-row{
  display:flex;align-items:center;gap:.8rem;
  padding:.7rem .8rem;border-radius:9px;
  background:var(--s2);border:1px solid var(--border);
  margin-bottom:.5rem;cursor:pointer;
  transition:border-color .15s;
}
.ds-course-row:hover{border-color:var(--border2)}
.ds-course-bar{width:3px;height:38px;border-radius:3px;flex-shrink:0}
.ds-course-info{flex:1;min-width:0}
.ds-course-name{font-size:.82rem;font-weight:600;color:var(--hi);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ds-course-sub{font-size:.7rem;color:var(--mid);margin-top:.15rem;
  font-family:var(--mono)}
.ds-course-time{font-size:.68rem;font-family:var(--mono);color:var(--dim);
  white-space:nowrap}

/* task row in day sheet */
.ds-task-row{
  display:flex;align-items:center;gap:.7rem;
  padding:.6rem .8rem;border-radius:9px;
  background:var(--s2);border:1px solid var(--border);
  margin-bottom:.45rem;
}
.ds-task-check{
  width:18px;height:18px;border-radius:5px;
  border:1.5px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;transition:all .15s;font-size:.65rem;
}
.ds-task-check.done{background:var(--gold);border-color:var(--gold);color:#07080f}
.ds-task-info{flex:1;min-width:0}
.ds-task-title{font-size:.82rem;color:var(--hi);transition:opacity .15s}
.ds-task-title.done{opacity:.4;text-decoration:line-through}
.ds-task-note{font-size:.68rem;color:var(--muted);margin-top:.1rem}
.ds-task-del{
  background:none;border:none;color:var(--muted);
  cursor:pointer;font-size:.8rem;padding:.2rem;
  transition:color .15s;
}
.ds-task-del:hover{color:#d47f7f}
.ds-empty{
  font-size:.76rem;color:var(--muted);
  padding:.5rem 0 .75rem;font-style:italic;
}

.ds-add-btn{
  width:100%;margin-top:.4rem;
  padding:.6rem;border-radius:9px;
  border:1px dashed var(--border2);background:none;
  color:var(--dim);font-family:var(--font);
  font-size:.78rem;cursor:pointer;transition:all .15s;
  display:flex;align-items:center;justify-content:center;gap:.4rem;
}
.ds-add-btn:hover{border-color:var(--gold);color:var(--gold)}

/* ── READ-ONLY DETAIL SHEET ── */
#detail-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.8);backdrop-filter:blur(8px);
  display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;transition:opacity .22s;
}
@media(min-width:700px){
  #detail-overlay{align-items:center;justify-content:center;padding:1rem}
}
#detail-overlay.open{opacity:1;pointer-events:all}
.detail-sheet{
  background:var(--s1);border:1px solid var(--border2);
  border-radius:var(--r-xl) var(--r-xl) 0 0;
  width:100%;max-height:80vh;overflow-y:auto;
  transform:translateY(30px);transition:transform .25s;
}
@media(min-width:700px){
  .detail-sheet{border-radius:var(--r-xl);max-width:440px;max-height:85vh}
}
#detail-overlay.open .detail-sheet{transform:translateY(0)}
.detail-head{
  padding:1.1rem 1.3rem .9rem;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;background:var(--s1);z-index:2;
}
.detail-head::after{
  content:'';position:absolute;
  top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
.detail-head-left{display:flex;align-items:center;gap:.65rem}
.detail-color-bar{width:4px;height:32px;border-radius:3px;flex-shrink:0}
.detail-title-wrap{}
.detail-code{font-family:var(--mono);font-size:.68rem;color:var(--gold);letter-spacing:.05em}
.detail-name{font-size:.92rem;font-weight:700;color:var(--hi);margin-top:.1rem;line-height:1.25}
.detail-body{padding:1.1rem 1.3rem 1.4rem;display:flex;flex-direction:column;gap:.75rem}
.detail-row{display:flex;gap:.8rem;align-items:flex-start}
.detail-icon{font-size:.9rem;flex-shrink:0;margin-top:.05rem;opacity:.7}
.detail-info{}
.detail-label{font-size:.6rem;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:.15rem}
.detail-value{font-size:.82rem;color:var(--base);line-height:1.4}
.detail-value.mono{font-family:var(--mono)}
.detail-chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.15rem}
.detail-chip{
  background:var(--s2);border:1px solid var(--border);
  border-radius:6px;padding:.2rem .55rem;
  font-family:var(--mono);font-size:.68rem;color:var(--mid);
}
.detail-divider{height:1px;background:var(--border);margin:.1rem 0}

/* TOAST */
.toast{
  position:fixed;bottom:5.5rem;left:50%;transform:translateX(-50%) translateY(10px);
  z-index:500;
  background:var(--s3);border:1px solid var(--border2);
  border-radius:9px;padding:.55rem 1.1rem;
  font-size:.78rem;color:var(--base);
  box-shadow:var(--sh-md);
  opacity:0;transition:all .25s;pointer-events:none;
  white-space:nowrap;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
@media(min-width:700px){
  .toast{bottom:2rem}
}

/* ── FAB ── */
.fab{
  position:fixed;right:1.2rem;bottom:5.2rem;
  width:50px;height:50px;border-radius:50%;
  background:var(--gold);color:#07080f;
  border:none;font-size:1.4rem;cursor:pointer;
  box-shadow:0 4px 20px var(--gold-glow);
  display:flex;align-items:center;justify-content:center;
  transition:transform .18s,box-shadow .18s;z-index:100;
}
.fab:hover{transform:scale(1.08);box-shadow:0 6px 28px var(--gold-glow)}
@media(min-width:700px){.fab{bottom:2rem;right:2rem}}
</style>
</head>
<body>
<div class="shell">

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-inner">
    <div class="hdr-left">
      <div class="hdr-brand">
        <div class="hdr-icon">📚</div>
        <div class="hdr-eyebrow">SCHEDULE</div>
      </div>
      <input class="edit-title" id="edit-title" value="ชื่อนักศึกษา" placeholder="ชื่อนักศึกษา" maxlength="60" oninput="saveState()">
      <div class="hdr-meta">
        <span class="sem-dot">◈</span>
        <input class="edit-sem" id="edit-sem" value="ภาคการศึกษาที่ 1/2567" placeholder="ภาคการศึกษา" maxlength="50" oninput="saveState()">
      </div>
    </div>
    <div class="hdr-pills">
      <div class="pill">หน่วยกิต<strong id="total-credits">0</strong></div>
      <div class="pill">วิชา<strong id="total-courses">0</strong></div>
      <a href="card.html" class="qr-link-btn" title="ดูการ์ด QR Code">📇 QR Card</a>
      <button class="edit-mode-btn" id="edit-mode-btn" onclick="toggleEditMode()" title="สลับโหมดแก้ไข">
        <span class="btn-dot"></span>
        <span id="edit-mode-label">แก้ไข</span>
      </button>
    </div>
  </div>
</div>

<!-- TABS -->
<div class="tabs-wrap">
  <button class="tab active" onclick="switchTab('grid',this)"><span class="tab-icon">⊞</span>ตาราง</button>
  <button class="tab" onclick="switchTab('cards',this)"><span class="tab-icon">▤</span>รายการ</button>
  <button class="tab" onclick="switchTab('calendar',this)"><span class="tab-icon">◻</span>ปฏิทิน</button>
</div>

<!-- VIEW-ONLY BAR -->
<div class="view-only-bar">
  🔒 &nbsp;โหมดดูอย่างเดียว — กดปุ่ม <strong style="color:var(--gold);margin:0 .3rem">แก้ไข</strong> เพื่อแก้ไขตาราง
</div>

<!-- ── GRID VIEW ── -->
<div id="view-grid" class="view active">
  <div class="tt-wrap">
    <div class="tt">
      <div class="tt-head">
        <div class="th-cell first">วัน</div>
        <div class="th-cell">8:00</div>
        <div class="th-cell">9:00</div>
        <div class="th-cell">10:00</div>
        <div class="th-cell">11:00</div>
        <div class="th-cell">12:00</div>
        <div class="th-cell">13:00</div>
        <div class="th-cell">14:00</div>
        <div class="th-cell">15:00</div>
        <div class="th-cell">16:00</div>
        <div class="th-cell">17:00</div>
        <div class="th-cell">18:00</div>
      </div>
      <div id="tt-body"></div>
    </div>
  </div>
</div>

<!-- ── CARDS VIEW ── -->
<div id="view-cards" class="view">
  <div id="cards-body"></div>
</div>

<!-- ── CALENDAR VIEW ── -->
<div id="view-calendar" class="view">
  <div class="cal-outer">
    <div class="cal-wrap">
      <div class="cal-top">
        <div class="cal-month-title" id="cal-title">—</div>
        <div class="cal-nav-grp">
          <button class="cal-today-btn" onclick="calGoToday()">วันนี้</button>
          <button class="cal-navbtn" onclick="calPrev()">‹</button>
          <button class="cal-navbtn" onclick="calNext()">›</button>
        </div>
      </div>
      <div class="cal-grid-hdr">
        <div class="cal-dh">อา</div><div class="cal-dh">จ</div>
        <div class="cal-dh">อ</div><div class="cal-dh">พ</div>
        <div class="cal-dh">พฤ</div><div class="cal-dh">ศ</div>
        <div class="cal-dh">ส</div>
      </div>
      <div class="cal-body" id="cal-body"></div>
      <div class="cal-add-task-row">
        <button class="cal-add-task-btn" onclick="openTaskModal(null, getTodayStr())">
          <span>+</span> เพิ่มงาน / กิจกรรมในปฏิทิน
        </button>
      </div>
    </div>
  </div>
</div>

</div><!-- .shell -->

<!-- FAB -->
<button class="fab" id="fab-btn" onclick="onFabClick()" title="เพิ่มวิชา">+</button>

<!-- ── COURSE MODAL ── -->
<div class="overlay" id="overlay" onclick="handleOverlayClick(event)">
  <div class="modal" id="modal">
    <div class="modal-head">
      <div class="modal-title" id="modal-title">เพิ่มวิชา</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="f-id">
      <div class="form-row">
        <label class="form-label">รหัสวิชา</label>
        <input class="form-input" id="f-code" placeholder="เช่น 9012042-54" maxlength="20">
      </div>
      <div class="form-row">
        <label class="form-label">ชื่อวิชา (ไทย)</label>
        <input class="form-input" id="f-name" placeholder="ชื่อวิชาภาษาไทย" maxlength="80">
      </div>
      <div class="form-row">
        <label class="form-label">ชื่อวิชา (อังกฤษ)</label>
        <input class="form-input" id="f-name-en" placeholder="Subject Name (English)" maxlength="80">
      </div>
      <div class="form-row-2">
        <div>
          <label class="form-label">วัน</label>
          <select class="form-input" id="f-day">
            <option value="1">จันทร์</option>
            <option value="2">อังคาร</option>
            <option value="3">พุธ</option>
            <option value="4">พฤหัสบดี</option>
            <option value="5">ศุกร์</option>
          </select>
        </div>
        <div>
          <label class="form-label">หน่วยกิต</label>
          <input class="form-input" id="f-credits" type="number" min="1" max="9" value="3">
        </div>
      </div>
      <div class="form-row-2">
        <div>
          <label class="form-label">เริ่ม (HH:MM)</label>
          <input class="form-input" id="f-start" placeholder="08:30" maxlength="5">
        </div>
        <div>
          <label class="form-label">สิ้นสุด (HH:MM)</label>
          <input class="form-input" id="f-end" placeholder="12:30" maxlength="5">
        </div>
      </div>
      <div class="form-row-2">
        <div>
          <label class="form-label">ห้องเรียน</label>
          <input class="form-input" id="f-room" placeholder="อาคาร4 ห้อง435" maxlength="40">
        </div>
        <div>
          <label class="form-label">อาจารย์</label>
          <input class="form-input" id="f-teacher" placeholder="ชื่ออาจารย์" maxlength="60">
        </div>
      </div>
      <div class="form-row">
        <label class="form-label">สีประจำวิชา</label>
        <div class="color-row" id="color-row"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-danger" id="btn-delete" onclick="deleteCourse()" style="display:none">ลบวิชา</button>
      <div class="btn-group-r">
        <button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>
        <button class="btn btn-primary" onclick="saveCourse()">บันทึก</button>
      </div>
    </div>
  </div>
</div>

<!-- ── TASK MODAL ── -->
<div class="overlay" id="task-overlay" onclick="handleTaskOverlayClick(event)">
  <div class="modal" id="task-modal">
    <div class="modal-head">
      <div class="modal-title" id="task-modal-title">เพิ่มงาน</div>
      <button class="modal-close" onclick="closeTaskModal()">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="tf-id">
      <div class="form-row">
        <label class="form-label">ชื่องาน / กิจกรรม</label>
        <input class="form-input" id="tf-title" placeholder="เช่น ส่งรายงาน, สอบปลายภาค" maxlength="80">
      </div>
      <div class="form-row">
        <label class="form-label">วันที่ (YYYY-MM-DD)</label>
        <input class="form-input" id="tf-date" type="date">
      </div>
      <div class="form-row">
        <label class="form-label">หมายเหตุ</label>
        <textarea class="form-input" id="tf-note" placeholder="รายละเอียดเพิ่มเติม (ถ้ามี)" maxlength="200"></textarea>
      </div>
      <div class="form-row">
        <label class="form-label">สี</label>
        <div class="color-row" id="task-color-row"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-danger" id="task-btn-delete" onclick="deleteTask()" style="display:none">ลบ</button>
      <div class="btn-group-r">
        <button class="btn btn-ghost" onclick="closeTaskModal()">ยกเลิก</button>
        <button class="btn btn-primary" onclick="saveTask()">บันทึก</button>
      </div>
    </div>
  </div>
</div>

<!-- ── DAY SHEET ── -->
<div id="day-overlay" onclick="handleDayOverlayClick(event)">
  <div class="day-sheet" id="day-sheet">
    <div class="day-sheet-head">
      <div class="day-sheet-title" id="day-sheet-title">—</div>
      <button class="modal-close" onclick="closeDaySheet()">✕</button>
    </div>
    <div class="day-sheet-body" id="day-sheet-body"></div>
  </div>
</div>

<!-- ── DETAIL SHEET (read-only) ── -->
<div id="detail-overlay" onclick="handleDetailOverlayClick(event)">
  <div class="detail-sheet" id="detail-sheet">
    <div class="detail-head" id="detail-head">
      <div class="detail-head-left">
        <div class="detail-color-bar" id="detail-color-bar"></div>
        <div class="detail-title-wrap">
          <div class="detail-code" id="detail-code"></div>
          <div class="detail-name" id="detail-name"></div>
        </div>
      </div>
      <button class="modal-close" onclick="closeDetailSheet()">✕</button>
    </div>
    <div class="detail-body" id="detail-body"></div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
/* ════════════════════════════════════════
   PALETTE & CONSTANTS
════════════════════════════════════════ */
const PALETTE = [
  {key:'mon',  fg:'#5b9bd6', bg:'rgba(91,155,214,.13)',  grad:'linear-gradient(145deg,#1a2d46 0%,#0d1b2e 100%)'},
  {key:'tue',  fg:'#c9607a', bg:'rgba(201,96,122,.13)',   grad:'linear-gradient(145deg,#3d1a25 0%,#200d15 100%)'},
  {key:'wed',  fg:'#5bba8f', bg:'rgba(91,186,143,.13)',   grad:'linear-gradient(145deg,#12342a 0%,#0a1e18 100%)'},
  {key:'thu',  fg:'#c9a040', bg:'rgba(201,160,64,.13)',   grad:'linear-gradient(145deg,#3a2c0d 0%,#1e1607 100%)'},
  {key:'fri',  fg:'#9268cc', bg:'rgba(146,104,204,.13)',  grad:'linear-gradient(145deg,#2c1e45 0%,#160e25 100%)'},
  {key:'cyan', fg:'#4db8b8', bg:'rgba(77,184,184,.13)',   grad:'linear-gradient(145deg,#0e2e30 0%,#06191a 100%)'},
  {key:'rose', fg:'#c45f8f', bg:'rgba(196,95,143,.13)',   grad:'linear-gradient(145deg,#3a1530 0%,#1e0a18 100%)'},

/* ════════════════════════════════════════
   HELPERS
════════════════════════════════════════ */
function getPal(key){ return PALETTE.find(p=>p.key===key)||PALETTE[0]; }
function timeToFrac(t){ const[h,m]=t.split(':').map(Number); return(h+m/60-8)/11; }
function escH(s){ return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function getTodayStr(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function dateStrToObj(s){
  const[y,mo,d]=s.split('-').map(Number);
  return new Date(y,mo-1,d);
}
function updateStats(){
  document.getElementById('total-credits').textContent = courses.reduce((s,c)=>s+Number(c.credits),0);
  document.getElementById('total-courses').textContent = courses.length;
}

function renderGrid(){
  const tbody = document.getElementById('tt-body');
  tbody.innerHTML='';
  [1,2,3,4,5].forEach(day=>{
    const pal = getPal(DAY_COL[day]);
    const row = document.createElement('div');
    row.className='tt-row';

    const label = document.createElement('div');
    label.className='tt-day-label';
    label.style.borderLeft=`3px solid ${pal.fg}`;
    label.innerHTML=`<span class="day-label-txt">${DAY_NAMES[day]}</span>
      <button class="day-add-btn" onclick="openModal(null,${day})">+ เพิ่ม</button>`;
    row.appendChild(label);

    const lane = document.createElement('div');
    lane.className='tt-lane';
    for(let i=0;i<11;i++){
      const cell=document.createElement('div');
      cell.className='lane-cell';
      cell.onclick=()=>openModal(null,day);
      lane.appendChild(cell);
    }
    const dayCourses=courses.filter(c=>c.day===day);
    dayCourses.forEach(c=>{
      const l=timeToFrac(c.start), r=timeToFrac(c.end);
      if(l>=1||r<=0) return;
      const cl=Math.max(0,l), cr=Math.min(1,r);
      const p=getPal(c.color);
      const blk=document.createElement('div');
      blk.className='cblock';
      blk.style.cssText=`left:calc(${cl*100}% + 4px);width:calc(${(cr-cl)*100}% - 8px);background:${p.bg};border-color:${p.fg};color:${p.fg};`;
      blk.innerHTML=`<div class="cb-code">${escH(c.code)}</div>
        <div class="cb-name">${escH(c.name)}</div>
        <div class="cb-room">${escH(c.room)}</div>`;
      blk.onclick=e=>{e.stopPropagation();openModal(c.id)};
      lane.appendChild(blk);
    });
    row.appendChild(lane);
    tbody.appendChild(row);
  });
}

/* ════════════════════════════════════════
   CALENDAR RENDER
════════════════════════════════════════ */
function renderCal(){
  document.getElementById('cal-title').textContent = TH_MONTHS[calMonth]+' '+(calYear+543);
  const body=document.getElementById('cal-body');
  body.innerHTML='';
  const first=new Date(calYear,calMonth,1).getDay();
  const dim=new Date(calYear,calMonth+1,0).getDate();
  const prevDim=new Date(calYear,calMonth,0).getDate();

  for(let i=first-1;i>=0;i--){
    body.appendChild(makeCalCell(prevDim-i,true,false,null));
  }
  for(let d=1;d<=dim;d++){
    const isToday=calYear===now.getFullYear()&&calMonth===now.getMonth()&&d===now.getDate();
    const dateStr=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    body.appendChild(makeCalCell(d,false,isToday,dateStr));
  }
  const total=first+dim;
  const trail=total%7===0?0:7-(total%7);
  for(let i=1;i<=trail;i++){
    body.appendChild(makeCalCell(i,true,false,null));
  }
}

function makeCalCell(d,other,today,dateStr){
  const cell=document.createElement('div');
  cell.className='cal-cell'+(other?' other':'')+(today?' today':'');
  if(!other && dateStr){
    cell.onclick=()=>openDaySheet(dateStr);
  }
  // date number
  const num=document.createElement('span');
  num.className='cal-num';
  num.textContent=d;
  cell.appendChild(num);

  if(!other && dateStr){
    // course dots: show for matching weekday (Sun=0,Mon=1...Sat=6)
    const jsDay=new Date(dateStr+'T12:00').getDay(); // 1=Mon..5=Fri
    const dayCourses=courses.filter(c=>c.day===jsDay);
    if(dayCourses.length>0){
      const dotsEl=document.createElement('div');
      dotsEl.className='cal-dots';
      const shown=dayCourses.slice(0,5);
      shown.forEach(c=>{
        const dot=document.createElement('div');
        dot.className='cal-dot';
        dot.style.background=getPal(c.color).fg;
        dotsEl.appendChild(dot);
      });
      cell.appendChild(dotsEl);
    }
    // task badge
    const dayTasks=tasks.filter(t=>t.date===dateStr);
    if(dayTasks.length>0){
      const badge=document.createElement('div');
      badge.className='cal-task-badge';
      badge.textContent=dayTasks.length;
      cell.appendChild(badge);
    }
  }
  return cell;
}

function calPrev(){calMonth--;if(calMonth<0){calMonth=11;calYear--;}renderCal();}
function calNext(){calMonth++;if(calMonth>11){calMonth=0;calYear++;}renderCal();}
function calGoToday(){calYear=now.getFullYear();calMonth=now.getMonth();renderCal();}

function openDaySheet(dateStr){
  currentDayStr=dateStr;
  const d=dateStrToObj(dateStr);
  const dayNum=d.getDay(); // 0=Sun,1=Mon..6=Sat
  const dayName=d.toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.getElementById('day-sheet-title').textContent=dayName;
  renderDaySheetBody(dateStr,dayNum);
  document.getElementById('day-overlay').classList.add('open');
}
function closeDaySheet(){document.getElementById('day-overlay').classList.remove('open');}
function handleDayOverlayClick(e){if(e.target===document.getElementById('day-overlay'))closeDaySheet();}

function renderDaySheetBody(dateStr,dayNum){
  const body=document.getElementById('day-sheet-body');
  body.innerHTML='';

  // courses section
  const dayCourses=courses.filter(c=>c.day===dayNum).sort((a,b)=>a.start.localeCompare(b.start));
  const courseLabel=document.createElement('div');
  courseLabel.className='ds-section-label';
  courseLabel.textContent='วิชาในวันนี้';
  body.appendChild(courseLabel);

  if(dayCourses.length===0){
    const emp=document.createElement('div');
    emp.className='ds-empty';
    emp.textContent='ไม่มีวิชา';
    body.appendChild(emp);
  } else {
    dayCourses.forEach(c=>{
      const p=getPal(c.color);
      const row=document.createElement('div');
      row.className='ds-course-row';
      row.innerHTML=`
        <div class="ds-course-bar" style="background:${p.fg}"></div>
        <div class="ds-course-info">
          <div class="ds-course-name">${escH(c.name)}</div>
          <div class="ds-course-sub">${escH(c.code)} · ${escH(c.room)}</div>
        </div>
        <div class="ds-course-time">${escH(c.start)}–${escH(c.end)}</div>`;
      row.onclick=()=>{closeDaySheet(); if(editMode){openModal(c.id);}else{openDetailSheet(c.id);}};
      body.appendChild(row);
    });
  }

  // tasks section
  const taskLabel=document.createElement('div');
  taskLabel.className='ds-section-label';
  taskLabel.style.marginTop='1rem';
  taskLabel.textContent='งาน / กิจกรรม';
  body.appendChild(taskLabel);

  const dayTasks=tasks.filter(t=>t.date===dateStr);
  if(dayTasks.length===0){
    const emp=document.createElement('div');
    emp.className='ds-empty';
    emp.textContent='ยังไม่มีงาน';
    body.appendChild(emp);
  } else {
    dayTasks.forEach(tk=>{
      const p=getPal(tk.color||'thu');
      const row=document.createElement('div');
      row.className='ds-task-row';
      row.innerHTML=`
        <div class="ds-task-check${tk.done?' done':''}" data-tid="${tk.id}" onclick="toggleTask(${tk.id},'${dateStr}',${dayNum})">${tk.done?'✓':''}</div>
        <div class="ds-task-info">
          <div class="ds-task-title${tk.done?' done':''}">${escH(tk.title)}</div>
          ${tk.note?`<div class="ds-task-note">${escH(tk.note)}</div>`:''}
        </div>
        <button class="ds-task-del" onclick="deleteTaskDirect(${tk.id},'${dateStr}',${dayNum})" title="ลบ">✕</button>`;
      body.appendChild(row);
    });
  }

  // add task button
  const addBtn=document.createElement('button');
  addBtn.className='ds-add-btn';
  addBtn.innerHTML='<span>+</span> เพิ่มงาน';
  addBtn.onclick=()=>{closeDaySheet();openTaskModal(null,dateStr);};
  body.appendChild(addBtn);
}

function toggleTask(id,dateStr,dayNum){
  const tk=tasks.find(t=>t.id===id);
  if(tk){tk.done=!tk.done;saveState();renderDaySheetBody(dateStr,dayNum);renderCal();}
}
function deleteTaskDirect(id,dateStr,dayNum){
  tasks=tasks.filter(t=>t.id!==id);
  saveState();renderDaySheetBody(dateStr,dayNum);renderCal();
  showToast('ลบงานเรียบร้อย');
}

function openModal(id,defaultDay){
  // In read-only mode: only allow viewing existing courses (not adding new ones)
  if(!editMode){
    if(id===null||id===undefined) return; // block adding
    openDetailSheet(id);
    return;
  }
  editingId=id;
  const del=document.getElementById('btn-delete');
  if(id!==null&&id!==undefined){
    const c=courses.find(x=>x.id===id);
    if(!c) return;
    document.getElementById('modal-title').textContent='แก้ไขวิชา';
    document.getElementById('f-id').value=c.id;
    document.getElementById('f-code').value=c.code;
    document.getElementById('f-name').value=c.name;
    document.getElementById('f-name-en').value=c.nameEn||'';
    document.getElementById('f-day').value=c.day;
    document.getElementById('f-start').value=c.start;
    document.getElementById('f-end').value=c.end;
    document.getElementById('f-room').value=c.room||'';
    document.getElementById('f-teacher').value=c.teacher||'';
    document.getElementById('f-credits').value=c.credits;
    selectedColor=c.color;
    del.style.display='block';
  } else {
    document.getElementById('modal-title').textContent='เพิ่มวิชา';
    ['f-id','f-code','f-name','f-name-en','f-room','f-teacher'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('f-day').value=defaultDay||1;
    document.getElementById('f-start').value='';
    document.getElementById('f-end').value='';
    document.getElementById('f-credits').value=3;
    selectedColor=DAY_COL[defaultDay||1];
    del.style.display='none';
  }
  buildColorSwatches();
  document.getElementById('overlay').classList.add('open');
  setTimeout(()=>document.getElementById('f-code').focus(),60);
}
function closeModal(){document.getElementById('overlay').classList.remove('open');}
function handleOverlayClick(e){if(e.target===document.getElementById('overlay'))closeModal();}

function saveCourse(){
  const code=document.getElementById('f-code').value.trim();
  const name=document.getElementById('f-name').value.trim();
  const start=document.getElementById('f-start').value.trim();
  const end=document.getElementById('f-end').value.trim();
  if(!code||!name||!start||!end){showToast('กรุณากรอกข้อมูลให้ครบ');return;}
  const data={
    day:parseInt(document.getElementById('f-day').value),
    code,name,
    nameEn:document.getElementById('f-name-en').value.trim(),
    start,end,
    room:document.getElementById('f-room').value.trim(),
    teacher:document.getElementById('f-teacher').value.trim(),
    credits:parseInt(document.getElementById('f-credits').value)||3,
    color:selectedColor,
  };
  if(editingId!==null&&editingId!==undefined){
    const idx=courses.findIndex(c=>c.id===editingId);
    if(idx>=0)courses[idx]={...courses[idx],...data};
    showToast('บันทึกเรียบร้อย ✓');
  } else {
    courses.push({id:nextId++,...data});
    showToast('เพิ่มวิชาเรียบร้อย ✓');
  }
  closeModal();saveState();renderAll();
}
function deleteCourse(){
  if(!confirm('ลบวิชานี้?'))return;
  courses=courses.filter(c=>c.id!==editingId);
  closeModal();saveState();renderAll();showToast('ลบวิชาเรียบร้อย');
}

  tasks=tasks.filter(t=>t.id!==editingTaskId);
  closeTaskModal();saveState();renderCal();showToast('ลบงานเรียบร้อย');
}

/* ════════════════════════════════════════
   DETAIL SHEET (read-only view)
════════════════════════════════════════ */
function openDetailSheet(id){
  const c=courses.find(x=>x.id===id);
  if(!c) return;
  const p=getPal(c.color);
  document.getElementById('detail-color-bar').style.background=p.fg;
  document.getElementById('detail-code').textContent=c.code;
  document.getElementById('detail-name').textContent=c.name;

  const body=document.getElementById('detail-body');
  body.innerHTML='';

  const rows=[
    c.nameEn ? {icon:'🌐',label:'ชื่อวิชา (EN)',value:c.nameEn} : null,
    {icon:'📅',label:'วัน',value:DAY_NAMES[c.day]},
    {icon:'🕐',label:'เวลา',value:`${c.start} – ${c.end}`,mono:true},
    c.room   ? {icon:'🏛️',label:'ห้องเรียน',value:c.room} : null,
    c.teacher? {icon:'👤',label:'อาจารย์ผู้สอน',value:c.teacher} : null,
    {icon:'⭐',label:'หน่วยกิต',value:`${c.credits} หน่วยกิต`,mono:true},
  ].filter(Boolean);

  rows.forEach((r,i)=>{
    if(i>0){
      const div=document.createElement('div');
      div.className='detail-divider';
      body.appendChild(div);
    }
    const row=document.createElement('div');
    row.className='detail-row';
    row.innerHTML=`
      <span class="detail-icon">${r.icon}</span>
      <div class="detail-info">
        <div class="detail-label">${r.label}</div>
        <div class="detail-value${r.mono?' mono':''}">${escH(r.value)}</div>
      </div>`;
    body.appendChild(row);
  });

  document.getElementById('detail-overlay').classList.add('open');
}
function closeDetailSheet(){document.getElementById('detail-overlay').classList.remove('open');}
function handleDetailOverlayClick(e){if(e.target===document.getElementById('detail-overlay'))closeDetailSheet();}

/* ════════════════════════════════════════
   EDIT MODE
════════════════════════════════════════ */
let editMode = false;

function toggleEditMode(){
  editMode = !editMode;
  document.body.classList.toggle('edit-mode', editMode);
  const btn  = document.getElementById('edit-mode-btn');
  const lbl  = document.getElementById('edit-mode-label');
  if(editMode){
    btn.classList.add('active');
    lbl.textContent = 'ล็อก';
    showToast('โหมดแก้ไข — สามารถเพิ่ม/แก้ไข/ลบได้');
  } else {
    btn.classList.remove('active');
    lbl.textContent = 'แก้ไข';
    showToast('บันทึกเรียบร้อย — กลับสู่โหมดดู');
  }
}

/* ════════════════════════════════════════
   TAB + FAB
════════════════════════════════════════ */
let currentTab='grid';
function switchTab(id,btn){
  currentTab=id;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('view-'+id).classList.add('active');
  btn.classList.add('active');
  if(id==='calendar')renderCal();
}

function onFabClick(){
  if(!editMode){showToast('กดปุ่ม "แก้ไข" ก่อนเพื่อเพิ่มข้อมูล');return;}
  if(currentTab==='calendar'){
    openTaskModal(null,getTodayStr());
  } else {
    openModal(null,1);
  }
}

/* ════════════════════════════════════════
   TOAST
════════════════════════════════════════ */
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}
