<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>QR Card – Chiranupong K</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c9a75c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#07080f;--s0:#0c0d17;--s1:#10121c;--s2:#161826;
  --border:#1e2236;--border2:#272c42;--muted:#363d58;
  --dim:#525c7a;--mid:#838dac;--base:#c2c8de;--hi:#eceef8;
  --gold:#c9a75c;--gold-lo:rgba(201,167,92,.10);
  --gold-glow:rgba(201,167,92,.22);--gold-hi:#dfc07a;
  --r:10px;--r-lg:14px;--r-xl:18px;
  --font:'Sarabun',sans-serif;
  --mono:'IBM Plex Mono',monospace;
  --sh-md:0 4px 28px rgba(0,0,0,.6),0 1px 4px rgba(0,0,0,.4);
}

html{scroll-behavior:smooth}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--base);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
}

/* ── HEADER (same as timetable) ── */
.hdr{
  background:var(--s1);
  border-bottom:1px solid var(--border);
  padding:1.1rem 1.4rem 1rem;
  position:relative;overflow:hidden;
}
.hdr::before{
  content:'';position:absolute;
  top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent 0%,var(--gold) 40%,var(--gold-hi) 55%,var(--gold) 70%,transparent 100%);
}
.hdr-inner{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.hdr-brand{display:flex;align-items:center;gap:.7rem}
.hdr-icon{
  width:32px;height:32px;border-radius:8px;
  background:linear-gradient(135deg,var(--gold) 0%,rgba(201,167,92,.3) 100%);
  border:1px solid var(--gold);
  display:flex;align-items:center;justify-content:center;
  font-size:.8rem;flex-shrink:0;
  box-shadow:0 0 16px var(--gold-glow);
}
.hdr-eyebrow{
  font-family:var(--mono);font-size:.6rem;
  letter-spacing:.15em;text-transform:uppercase;color:var(--gold);
}
.hdr-title{font-size:.95rem;font-weight:700;color:var(--hi);margin-top:.1rem}

.back-btn{
  display:flex;align-items:center;gap:.4rem;
  padding:.32rem .85rem;border-radius:20px;
  border:1px solid var(--border2);background:var(--s2);
  font-size:.68rem;font-family:var(--mono);
  color:var(--mid);cursor:pointer;
  transition:all .2s;white-space:nowrap;
  letter-spacing:.04em;text-decoration:none;
}
.back-btn:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-lo)}

/* ── MAIN ── */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:3rem 1.5rem 3rem;
  gap:1.8rem;
}

/* ── EYEBROW ── */
.eyebrow{
  font-family:var(--mono);font-size:.65rem;
  letter-spacing:.18em;text-transform:uppercase;
  color:var(--gold);text-align:center;
}

/* ── FLIP CARD ── */
.scene{
  width:520px;height:290px;
  perspective:1200px;
  cursor:pointer;
}
@media(max-width:580px){
  .scene{width:92vw;height:calc(92vw * (290/520))}
}

.card-inner{
  width:100%;height:100%;
  position:relative;
  transform-style:preserve-3d;
  transition:transform .75s cubic-bezier(.4,.2,.2,1);
}
.scene.flipped .card-inner{transform:rotateY(180deg)}

.card-face{
  position:absolute;width:100%;height:100%;
  backface-visibility:hidden;
  border-radius:18px;overflow:hidden;
  border:1px solid rgba(201,167,92,.25);
  box-shadow:0 0 32px rgba(201,167,92,.14);
}
.card-face img{width:100%;height:100%;object-fit:cover;display:block}
.back{transform:rotateY(180deg)}

/* ── HINT ── */
.hint{
  display:flex;align-items:center;gap:.5rem;
  font-family:var(--mono);font-size:.68rem;
  letter-spacing:.08em;color:var(--dim);
}
.hint-icon{
  animation:spin 2.6s linear infinite;
  display:inline-block;transform-origin:center;
}
@keyframes spin{
  0%{transform:rotate(0deg);opacity:.35}
  50%{opacity:1}
  100%{transform:rotate(360deg);opacity:.35}
}

/* ── FOOTER ── */
.footer{
  border-top:1px solid var(--border);
  padding:.85rem 1.4rem;
  text-align:center;
  font-family:var(--mono);font-size:.6rem;
  letter-spacing:.1em;color:var(--muted);
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-inner">
    <div class="hdr-brand">
      <div class="hdr-icon">📇</div>
      <div>
        <div class="hdr-eyebrow">QR CARD</div>
        <div class="hdr-title">Chiranupong K</div>
      </div>
    </div>
    <a href="index.html" class="back-btn">← ตารางเรียน</a>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <div class="eyebrow">แตะการ์ดเพื่อพลิก</div>

  <div class="scene" id="card">
    <div class="card-inner">
      <div class="card-face front">
        <img src="images/front.png" alt="Front Card">
      </div>
      <div class="card-face back">
        <img src="images/back.png" alt="Back Card – QR Code">
      </div>
    </div>
  </div>

  <div class="hint">
    <span class="hint-icon">↻</span>
    <span id="hint-text">พลิกดู QR Code</span>
  </div>

</div>

<!-- FOOTER -->
<div class="footer">CHIRANUPONG K &nbsp;·&nbsp; © 2025</div>

<script>
const card     = document.getElementById('card');
const hintText = document.getElementById('hint-text');
card.addEventListener('click', () => {
  const flipped = card.classList.toggle('flipped');
  hintText.textContent = flipped ? 'พลิกกลับด้านหน้า' : 'พลิกดู QR Code';
});
</script>
</body>
</html>
